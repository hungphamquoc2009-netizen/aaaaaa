<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - GARENA PRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #050505; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .auth-box { background: #111; padding: 40px; border-radius: 20px; width: 400px; border-top: 5px solid #eb0029; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .auth-box h2 { text-align: center; font-size: 28px; margin-bottom: 25px; font-style: italic; }
        .auth-box h2 span { color: #eb0029; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 14px; background: #222; border: 1px solid #333; border-radius: 8px; color: #fff; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #eb0029; }
        .btn-submit { width: 100%; padding: 15px; background: #eb0029; color: #fff; border: none; border-radius: 8px; font-weight: 900; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-submit:hover { box-shadow: 0 0 15px rgba(235,0,41,0.5); }
        .link-bot { text-align: center; margin-top: 20px; font-size: 13px; color: #888; }
        .link-bot a { color: #eb0029; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-box">
        <h2>GARENA <span>PRO</span></h2>
        
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="Nhập email...">
        </div>
        <div class="input-group">
            <label>Mật Khẩu</label>
            <input type="password" id="login-pass" placeholder="••••••••" onkeypress="if(event.key === 'Enter') loginUser()">
        </div>

        <button class="btn-submit" id="btn-login" onclick="loginUser()">ĐĂNG NHẬP</button>
        <div class="link-bot">Chưa có tài khoản? <a href="dang-ky.html">Đăng ký ngay</a></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyClgn4G01Z9pqAqIj3-NwJ8a0tS1l4AAZU",
            authDomain: "garenabusiness-c3609.firebaseapp.com",
            projectId: "garenabusiness-c3609",
            storageBucket: "garenabusiness-c3609.firebasestorage.app",
            messagingSenderId: "1030376090857",
            appId: "1:1030376090857:web:bc9cf645e6216007d7d478"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Kiểm tra nếu đã đăng nhập thì văng thẳng vào Dashboard luôn
        auth.onAuthStateChanged((user) => {
            if (user) window.location.href = "dashboard.html";
        });

        function loginUser() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            if(!email || !pass) return alert("Vui lòng nhập Email và Mật khẩu!");

            const btn = document.getElementById('btn-login');
            btn.disabled = true; btn.innerText = "ĐANG XỬ LÝ...";

            auth.signInWithEmailAndPassword(email, pass).then(() => {
                // Đăng nhập thành công, auth.onAuthStateChanged ở trên sẽ tự động chuyển trang
            }).catch((error) => {
                alert("Đăng nhập thất bại. Vui lòng kiểm tra lại Email/Mật khẩu!");
                btn.disabled = false; btn.innerText = "ĐĂNG NHẬP";
            });
        }
    </script>
</body>
</html>
