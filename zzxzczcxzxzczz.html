<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Admin - Quản lý Nạp Tiền</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .btn-add { background: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .btn-add:hover { background: #218838; }
    </style>
</head>
<body>

    <h2>Danh sách giao dịch ngân hàng (MB Bank)</h2>
    <button onclick="fetchBankHistory()">Làm mới lịch sử</button>

    <table id="bankTable">
        <thead>
            <tr>
                <th>Mã GD</th>
                <th>Nội dung</th>
                <th>Số tiền</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody id="bankData">
            </tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc, increment, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyClgn4G01Z9pqAqIj3-NwJ8a0tS1l4AAZU",
            authDomain: "garenabusiness-c3609.firebaseapp.com",
            projectId: "garenabusiness-c3609",
            storageBucket: "garenabusiness-c3609.firebasestorage.app",
            messagingSenderId: "1030376090857",
            appId: "1:1030376090857:web:bc9cf645e6216007d7d478"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // API lấy lịch sử bank của bạn
        const BANK_API = "https://thueapibank.vn/historyapimbbank/dd65155fed0d9b7fd566a549947f7f8c";

        async function fetchBankHistory() {
            const response = await fetch(BANK_API);
            const resData = await response.json();
            const transactions = resData.data; // Tùy cấu trúc API trả về

            const tableBody = document.getElementById('bankData');
            tableBody.innerHTML = "";

            transactions.forEach(trans => {
                const row = `
                    <tr>
                        <td>${trans.transactionId || trans.refNo}</td>
                        <td>${trans.description}</td>
                        <td>${trans.creditAmount}đ</td>
                        <td><button class="btn-add" onclick="manualAddMoney('${trans.description}', ${trans.creditAmount})">Cộng tiền</button></td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        // Hàm cộng tiền thủ công dựa trên nội dung chuyển khoản
        window.manualAddMoney = async (content, amount) => {
            // Giả sử nội dung là "NAP 123456", ta lấy số 123456 làm ID người dùng
            const userId = content.replace(/\D/g, ""); 
            
            if(!userId) {
                alert("Không tìm thấy ID người dùng trong nội dung!");
                return;
            }

            try {
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    balance: increment(amount) // Cộng thêm tiền vào số dư cũ
                });
                alert(`Đã cộng thành công ${amount}đ cho User: ${userId}`);
            } catch (error) {
                console.error(error);
                alert("Lỗi: Người dùng này không tồn tại trong Database!");
            }
        }

        // Chạy lần đầu
        fetchBankHistory();
    </script>
</body>
</html>
